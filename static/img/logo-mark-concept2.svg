<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0021A5" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="prismRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0021A5" />
    </linearGradient>

    <linearGradient id="rayBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="rayOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA4616" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
  </defs>

  <!-- Left 'D' Facet (Deep UF Blue) -->
  <path d="M 12 7 L 22 7 C 32 7, 36 15, 30 24 C 36 33, 31 41, 21 41 L 12 41 Z" 
        fill="none" 
        stroke="url(#prismLeft)" 
        stroke-width="4.5" 
        stroke-linejoin="round" />

  <!-- Diagonal 'V' Visualisation Cut-through -->
  <path d="M 21 16 L 27.5 31 L 41 9" 
        fill="none" 
        stroke="url(#rayOrange)" 
        stroke-width="4.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Focal Data Nodes -->
  <circle cx="21" cy="16" r="2.5" fill="#0021A5" />
  <circle cx="27.5" cy="31" r="2.5" fill="#FA4616" stroke="#FFFFFF" stroke-width="1.2" />
  <circle cx="41" cy="9" r="3.2" fill="#FA4616" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
