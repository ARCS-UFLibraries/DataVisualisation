<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Background tile subtle gradient -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0021A5" />
      <stop offset="100%" stop-color="#0A1854" />
    </linearGradient>

    <!-- Bar gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FA4616" />
    </linearGradient>

    <!-- Trend line glow/shadow filter -->
    <filter id="trendShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#FA4616" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#sqBg)" />
  <rect x="2" y="2" width="44" height="44" rx="11" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Subtle Data Grid lines -->
  <line x1="8" y1="36" x2="40" y2="36" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="26" x2="40" y2="26" stroke="rgba(255,255,255,0.07)" stroke-width="0.8" stroke-dasharray="2 2" />
  <line x1="8" y1="16" x2="40" y2="16" stroke="rgba(255,255,255,0.07)" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Data Metric Bars -->
  <!-- Bar 1 (Baseline: y=36, height: 12 -> y=24) -->
  <rect x="11" y="24" width="5.5" height="12" rx="2.2" fill="url(#bar1Grad)" />
  
  <!-- Bar 2 (Baseline: y=36, height: 18 -> y=18) -->
  <rect x="20" y="18" width="5.5" height="18" rx="2.2" fill="url(#bar2Grad)" />
  
  <!-- Bar 3 (Peak focal bar: height: 25 -> y=11) -->
  <rect x="29" y="11" width="5.5" height="25" rx="2.2" fill="url(#bar3Grad)" />

  <!-- Dynamic Trend Curve (connecting visual story) -->
  <path d="M 10 30 C 16 27, 21 17, 31.5 13 S 38 12, 40 10.5" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        filter="url(#trendShadow)" />

  <!-- Accent Pivot Coordinate Node (Data Insight Point) -->
  <circle cx="31.75" cy="13" r="3.2" fill="#FA4616" stroke="#FFFFFF" stroke-width="1.8" />
</svg>
